# z-schedule-admin 演示应用配置
# 本地启动（两条都实测过，原文读数见 _doc/003_script/e2e/README.md §17.2）：
#   mvn -B spring-boot:run \
#     -Dspring-boot.run.profiles=dev \
#     -Dspring-boot.run.arguments=--z.base.db.schedule.disabled=true
#   ⇒ 绑定 8080、context-path 为空。18086 与 /meta 只来自 deploy/Dockerfile.backend 的 ENV
#     与 compose 的 env，本文件从没设过 server.*，所以旧注释里那两行 `--server.port=18086`
#     `--server.servlet.context-path=/meta` 直接跟在 mvn 后面时 **Maven 会拒**
#     （`Unrecognized option`，rc=1，应用一次都没起来）：给 Maven 传应用参数只能走 -Dspring-boot.run.*。
#
# 默认 profile (无 active) 走 MySQL, 生产用 local profile 读环境变量.
# dev profile 走 H2 内存数据库，但它【不是】"零依赖可玩"：
#   1) 必须给 z.base.db.schedule.disabled=true —— 否则 starter 的 dataSourceSchedule 与
#      DevDataSourceConfig 的同名 @Bean 撞车（starter 那两支没有 @ConditionalOnMissingBean），
#      Boot 2.1+ 默认禁止同名覆盖 ⇒ APPLICATION FAILED TO START；
#   2) H2 里没有任何表（本模块无 schema.sql）⇒ 外壳 / 与 /actuator/health 是 200，
#      而 /jobinfo/list、/dashboard/stats 实测 500（table not found）。
#
# ⚠️ 严禁明文凭证：所有敏感字段读环境变量，默认占位符保证启动失败而非泄露
# 本地真实值放 src/main/resources/application-local.yml（gitignored）

spring:
  application:
    name: z-schedule-admin
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}    # 本地开发: dev (H2) / local (MySQL)

  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: ${DB_DRIVER:com.mysql.cj.jdbc.Driver}
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/zschedule_dev}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:}    # ✅ 必须从环境变量读, 严禁明文
    druid:
      # ⚠ 这一段配的池**不是调度引擎用的那个**：starter 的 `dataSourceSchedule`
      # 由 z-boot 的 ModuleDataSourceTemplate 自建，只读 `z.base.db.schedule.*`（见下面那块）。
      # 这里是 Spring Boot 自己的 DataSource（actuator 的 db 健康检查用的就是它）。
      # 实测（250，2026-09-26）：一个空闲的 admin 实例挂着 10 条连接 = 5 条引擎在用 + 5 条这个空转池，
      # 而 `max-active` 改这里对吞吐毫无影响（改 `z.base.db.schedule.max-active` 才有，316 → 540 次/s）。
      # 所以它降到 0 起步：不白占连接，被健康检查用到时才建。
      initial-size: 0
      min-idle: 0
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      pool-prepared-statements: true
      max-pool-prepared-statement-per-connection-size: 20
      filters: stat,wall,slf4j
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

  # Leader 续约与周期 reconcile 都挂在 @Scheduled 上，Spring 默认只给 1 条调度线程，
  # 两者会互相排队（续约窗口 30s、reconcile 15s）；独立应用直接开 2 条。
  task:
    scheduling:
      pool:
        size: 2

# 运维探针面。
# 这一段原先写作 `spring.actuator.*`（缩进在 spring: 之下），而 Boot 读的是顶层 `management.*`
# ⇒ 整块是死配置，和下面 logging.level 那条（包名改了 yml 没跟着改，引擎 debug 日志哑了两周）同一种病。
# 250 真机在跑着的构件 a16473a 上实测（不带任何 override）：
#   /actuator/info                404     ← include 没生效，默认只暴露 health
#   /actuator/health              200 {"status":"UP"}   ← show-details 没生效
#   /actuator/health/liveness     404
#   /actuator/health/readiness    404
# 而 deploy/k8s/01-deployment-backend.yaml 的 livenessProbe/readinessProbe 指的就是后两条。
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Boot 只在"检测到 Kubernetes 平台"时才自动建这两个组，所以在本机 / 250 / docker-compose 里
      # 它们天生 404 —— 部署文件承诺的探测在离集群的地方一次都没被验过。显式打开，任何平台都能验。
      probes:
        enabled: true
      # 实测到的真缺陷：Boot 自动建的 readiness 组**不含数据源**。把 spring.datasource.url 指到
      # 一个没人听的 33999 端口后，顶层 /actuator/health 正确 503 DOWN（druid 报
      # GetConnectionTimeoutException），而 /actuator/health/readiness 仍回 **200 UP**
      # ⇒ 照 manifest 部署时，库死了 pod 依然"就绪"、继续接流量。这里显式把 db 拉进 readiness。
      # liveness 故意不含 db：库短暂抖动不该把进程重启掉（重启只会让 reconcile 更糟）。
      group:
        liveness:
          include: ping,livenessState
        readiness:
          include: readinessState,db
      # 明细不对匿名铺：DOWN 时的 detail 里是连接池内部状态和驱动报错原文（实测含
      # `GetConnectionTimeoutException: wait millis 3000, active 0, maxActive 20, creating 4`，
      # 把自家池容量摆给匿名；JDBC 地址本身这次没漏出来，实测 grep "33999" 零命中）。
      # 而演示模式（没配 accessToken）整个 HTTP 面是敞开的。探针靠 HTTP 码说话，不靠 body。
      # 原先写的 always 其实从未生效过（就是上面那段死配置），这条改动没有扩大暴露面。
      show-details: when-authorized

# 调度引擎自己的连接池（starter 的 dataSourceSchedule 读这里，不读上面 spring.datasource.druid.*）。
# 250 真机 N=800 个 1Hz 任务、30s 窗口实测：max-active 20 ⇒ 316 次/s，40 ⇒ 540 次/s，80 ⇒ 808 次/s，
# 而忙连接峰值每次都正好等于上限 ⇒ 池就是那堵墙（每条语句墙钟从 31.6 ms 涨到 49.5 ms，所以是次线性）。
# 取 40：拿到 +71 % 而只多用 20 条连接。**抬之前必须确认 MySQL 侧 max_connections 有余量**
# （这套库是被同机其他服务共用的），所以 starter/`ModuleDataSourceTemplate` 的默认值仍是 20，
# 这里只对独立部署的 admin 显式抬高；嵌入方请按自己的库容量决定。
z:
  base:
    db:
      schedule:
        max-active: ${Z_SCHEDULE_DB_MAX_ACTIVE:40}

# Z-Schedule 配置
# 注意：真正生效的前缀只有 `z.schedule.*`（ZScheduleAutoConfiguration 上 @ConfigurationProperties("z.schedule")）。
# 下面这段 `zschedule.*` 是从 xxl-job 风格的样例配置抄来的，本工程没有任何代码读它——
# 留着是因为 executor/addresses 属于"远程派发"那件还没实现的事，删掉会丢掉意图；但它不参与启动。
zschedule:
  admin:
    addresses: ${ZSCHEDULE_ADMIN_ADDRESSES:http://localhost:18086/schedule}
  executor:
    appname: z-schedule-executor
    ip:
    port: 9999
    logpath: ${ZSCHEDULE_EXECUTOR_LOGPATH:/tmp/applogs/z-schedule/jobhandler}
    logretentiondays: 30
  cluster:
    enabled: ${ZSCHEDULE_CLUSTER_ENABLED:false}

# 日志
logging:
  level:
    root: info
    # 包名在 1.0.x 从 io.github.yuku123.z.schedule 改成 com.zifang.z.schedule，这行当时没跟着改，
    # 于是引擎/调度的 debug 日志（"Engine loaded N jobs into ring" 这类）在演示应用里一直是哑的。
    com.zifang.z.schedule: debug
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n"
  file:
    name: ${ZSCHEDULE_LOG_PATH:/tmp/applogs/z-schedule/admin/z-schedule-admin.log}
