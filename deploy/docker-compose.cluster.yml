# Mode 3：集群部署（1 前端 nginx + N 后端 jar）
# 适用：生产 / 多高副本 / 灰度发布
#
# 启动：cd deploy && docker compose -f docker-compose.cluster.yml up -d
# 访问：http://localhost
# 调整后端副本：docker compose -f docker-compose.cluster.yml up -d --scale z-schedule-backend=3
# 停止：docker compose -f docker-compose.cluster.yml down

services:
  z-schedule-backend:
    image: "${OCI_REGISTRY:-ghcr.io/yuku123}/z-schedule-admin:${IMAGE_VERSION:-1.0.4}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        JAR_FILE: "${JAR_FILE:-z-schedule-admin/target/z-schedule-admin-1.0.0-exec.jar}"
    restart: unless-stopped
    # 不固定 replicas，命令行 --scale 决定（默认 1）
    expose:
      - "18086"
    environment:
      # 两个池都要喂（同 docker-compose.yml 的注释）：多副本共用同一个库，
      # 谁拿到 z_schedule_lock 谁当 Leader
      # 库坐标五项都不许有静默默认值：DB_HOST/DB_PORT/DB_NAME/DB_USER 用 ${V:?…}（没写或留空都拒），
      # DB_PASSWORD 用 ${V?…}（没写拒、显式留空放行）。`:?` 与 `?` 的差别在 250 的 compose v5.0.2 上实测，
      # 判据见 p25.sh 的 P18；坏形状取证见 p24.sh 的 B12。
      Z_BASE_DB_SCHEDULE_HOST: "${DB_HOST:?缺 DB_HOST：三种模式的容器都不自带数据库，见 env/.env.example}"
      Z_BASE_DB_SCHEDULE_PORT: "${DB_PORT:?缺 DB_PORT：库坐标不许有静默默认值，见 env/.env.example（坏形状取证 p24.sh 的 B12）}"
      Z_BASE_DB_SCHEDULE_DATABASE: "${DB_NAME:?缺 DB_NAME：空库名让引擎池连上一个不存在的库（URL 会是 …:3306/?serverTimezone…）}"
      Z_BASE_DB_SCHEDULE_USERNAME: "${DB_USER:?缺 DB_USER：不填就退回 starter 内置的 root}"
      Z_BASE_DB_SCHEDULE_PASSWORD: "${DB_PASSWORD?缺 DB_PASSWORD：显式留空是合法的（无口令库），整行没写才是漏配}"
      Z_SCHEDULE_DB_MAX_ACTIVE: "${DB_POOL_MAX_ACTIVE:-40}"
      SPRING_DATASOURCE_URL: "jdbc:mysql://${DB_HOST:?缺 DB_HOST：三种模式的容器都不自带数据库，见 env/.env.example}:${DB_PORT:?缺 DB_PORT：库坐标不许有静默默认值，见 env/.env.example（坏形状取证 p24.sh 的 B12）}/${DB_NAME:?缺 DB_NAME：空库名让引擎池连上一个不存在的库（URL 会是 …:3306/?serverTimezone…）}?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8"
      SPRING_DATASOURCE_USERNAME: "${DB_USER:?缺 DB_USER：不填就退回 starter 内置的 root}"
      SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD?缺 DB_PASSWORD：显式留空是合法的（无口令库），整行没写才是漏配}"
      SERVER_SERVLET_CONTEXT_PATH: "/meta"
      JAVA_OPTS: "${JAVA_OPTS:--Xms512m -Xmx1g}"
    networks:
      - z-schedule-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18086/meta/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  z-schedule-frontend:
    image: "${OCI_REGISTRY:-ghcr.io/yuku123}/z-schedule-frontend:${IMAGE_VERSION:-1.0.4}"
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      # 宿主端口可配（同 docker-compose.split.yml 的注释：250 上 :80 被宿主进程占着，钉死就起不来）
      - "${HTTP_PORT:-80}:80"
    environment:
      # nginx 反代到 backend service（docker compose 自动 DNS）
      BACKEND_SERVICE: z-schedule-backend
    networks:
      - z-schedule-net
    depends_on:
      z-schedule-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  z-schedule-net:
    driver: bridge

# 验证步骤：
# 1. 启动 3 副本：docker compose -f docker-compose.cluster.yml up -d --scale z-schedule-backend=3
# 2. docker compose -f docker-compose.cluster.yml ps（应看到 1 个 frontend + 3 个 backend 容器）
# 3. 访问前端：http://localhost/（nginx 自动负载均衡到 3 个后端）
# 4. 查看后端轮询：curl http://localhost/api/actuator/health（连续多次，看是否命中不同后端实例）
# 5. 验证某个后端挂了还能服务：docker stop z-schedule-backend-z-schedule-backend-1，
#    再 curl http://localhost/api/actuator/health（应仍返回 UP，nginx 自动跳过挂了的后端）