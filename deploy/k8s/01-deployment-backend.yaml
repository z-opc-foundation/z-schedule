# 01-statefulset-backend.yaml
# 后端 Deployment（无状态，replicas 可调，HPA 友好）
# 占位符：${NAMESPACE}, ${OCI_REGISTRY}, ${IMAGE_VERSION}, ${DB_PASSWORD}

apiVersion: apps/v1
kind: Deployment
metadata:
  name: z-schedule-backend
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: z-schedule
    app.kubernetes.io/component: backend
    z.opc.io/layer: L3
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: z-schedule
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: z-schedule
        app.kubernetes.io/component: backend
        z.opc.io/layer: L3
    spec:
      serviceAccountName: z-schedule
      containers:
        - name: z-schedule
          image: ${OCI_REGISTRY}/yuku123/z-schedule-admin:${IMAGE_VERSION}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18086
          env:
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1g"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: z-schedule-db-credentials
                  key: password
            - name: SPRING_PROFILES_ACTIVE
              value: "k8s"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /meta/actuator/health/liveness
              port: 18086
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /meta/actuator/health/readiness
              port: 18086
            initialDelaySeconds: 30
            periodSeconds: 5
---
# 数据库凭证 Secret（部署前手动 kubectl apply）
# kubectl -n ${NAMESPACE} create secret generic z-schedule-db-credentials \
#     --from-literal=password='YOUR_DB_PASSWORD'
# 此处不直接定义 Secret 内容（避免凭证入 Git）