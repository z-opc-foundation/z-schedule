# 01-deployment-backend.yaml
# 后端 ConfigMap + Deployment
# 占位符：${NAMESPACE}, ${OCI_REGISTRY}, ${IMAGE_VERSION},
#         ${DB_HOST}, ${DB_PORT}, ${DB_NAME}, ${DB_USER}, ${DB_POOL_MAX_ACTIVE}
#
# 为什么这里必须出现两组坐标：
#   本进程有两个连接池，MyBatis/调度引擎跑在 starter 的 dataSourceSchedule 上，
#   它由 z-boot ModuleDataSourceTemplate 按 z.base.db.<module>.* 读取，读不到就退回
#   内置默认值（host=localhost / port=3306 / username=root / password=空 / **库名为空**）。
#   spring.datasource.* 建的是另一个 druid 池（actuator health 里 db 的子项 dataSource），
#   只喂它的话引擎池照样连 localhost:3306 的空库。2026-09-27 之前这份清单只给了
#   SPRING_DATASOURCE_PASSWORD + SPRING_PROFILES_ACTIVE=k8s，两条都不落在引擎池的键上。
#
# 密码只有一个 key：两个池在这套部署里用同一份账号。
#   kubectl -n ${NAMESPACE} create secret generic z-schedule-db-credentials \
#       --from-literal=password='YOUR_DB_PASSWORD'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: z-schedule-config
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: z-schedule
    app.kubernetes.io/component: backend
data:
  # 探针路径带 /meta 前缀，就得保证进程真的挂在 /meta 下（application.yml 不设 context-path，
  # 默认是 /；这个 env 是镜像外唯一把它钉成 /meta 的地方）
  SERVER_SERVLET_CONTEXT_PATH: "/meta"
  # 没有 application-k8s.yml，所以别再设 k8s 这个 profile
  SPRING_PROFILES_ACTIVE: "default"

  # —— 引擎池（调度真正用的那个）——
  Z_BASE_DB_SCHEDULE_HOST: "${DB_HOST}"
  Z_BASE_DB_SCHEDULE_PORT: "${DB_PORT}"
  Z_BASE_DB_SCHEDULE_DATABASE: "${DB_NAME}"
  Z_BASE_DB_SCHEDULE_USERNAME: "${DB_USER}"
  # application.yml 里 z.base.db.schedule.max-active 就是这个占位符
  Z_SCHEDULE_DB_MAX_ACTIVE: "${DB_POOL_MAX_ACTIVE}"

  # —— Spring 池 ——
  SPRING_DATASOURCE_URL: "jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?serverTimezone=UTC&useUnicode=true&characterEncoding=utf-8"
  SPRING_DATASOURCE_USERNAME: "${DB_USER}"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: z-schedule-backend
  namespace: ${NAMESPACE}
  labels:
    app.kubernetes.io/name: z-schedule
    app.kubernetes.io/component: backend
    z.opc.io/layer: L3
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: z-schedule
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: z-schedule
        app.kubernetes.io/component: backend
        z.opc.io/layer: L3
    spec:
      serviceAccountName: z-schedule
      containers:
        - name: z-schedule
          # 与 bin/build-images.sh 打出来的 tag 逐字一致：曾经这里多写了一段 yuku123
          # （ghcr.io/yuku123/yuku123/...），pod 拉的是从没构建过的名字
          image: ${OCI_REGISTRY}/z-schedule-admin:${IMAGE_VERSION}
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 18086
          envFrom:
            - configMapRef:
                name: z-schedule-config
          env:
            - name: JAVA_OPTS
              value: "-Xms512m -Xmx1g"
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: z-schedule-db-credentials
                  key: password
            - name: Z_BASE_DB_SCHEDULE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: z-schedule-db-credentials
                  key: password
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "2Gi"
          # 这两条路径由 application.yml 顶层 management.* 显式建的组（probes.enabled=true，
          # 所以不靠 K8s 平台探测也存在）；show-details=when-authorized，匿名只回 status
          livenessProbe:
            httpGet:
              path: /meta/actuator/health/liveness
              port: 18086
            initialDelaySeconds: 60
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /meta/actuator/health/readiness
              port: 18086
            initialDelaySeconds: 30
            periodSeconds: 5
