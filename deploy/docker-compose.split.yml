# Mode 2：分体部署（前端 nginx + 后端 jar，两个容器）
# 适用：前端频繁迭代 / 前端团队独立 / 需要 CDN 缓存前端
#
# 启动：cd deploy && docker compose -f docker-compose.split.yml up -d
# 访问：http://localhost
# 停止：docker compose -f docker-compose.split.yml down

services:
  z-schedule-backend:
    container_name: z-schedule-backend
    image: ghcr.io/yuku123/z-schedule-admin:1.0.1
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
      args:
        JAR_FILE: z-schedule-admin/target/z-schedule-admin-1.0.0-exec.jar
    restart: unless-stopped
    expose:
      - "18086"
    # 不映射 18086 到 host（仅 internal network 访问）
    environment:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:zschedule;DB_CLOSE_DELAY=-1
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""
      JAVA_OPTS: "-Xms512m -Xmx1g"
    networks:
      - z-schedule-net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18086/meta/actuator/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  z-schedule-frontend:
    container_name: z-schedule-frontend
    image: ghcr.io/yuku123/z-schedule-frontend:1.0.1
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # nginx.conf.template 里的 ${BACKEND_SERVICE} 通过这里注入
      BACKEND_SERVICE: z-schedule-backend
    networks:
      - z-schedule-net
    depends_on:
      z-schedule-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  z-schedule-net:
    driver: bridge

# 验证步骤：
# 1. docker compose -f docker-compose.split.yml ps（两个容器都 healthy）
# 2. 访问：http://localhost/（前端 SPA）
# 3. 验证前端能反代到后端：curl http://localhost/api/actuator/health（应返回 UP）
# 4. 验证后端独立可访问：docker exec -it z-schedule-backend curl http://127.0.0.1:18086/meta/actuator/health